name: verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # There are no dependencies, so there is nothing to install. This is the whole
      # build: syntax and consistency checks, the test suite, then both browser builds.
      - name: Check, test and build
        run: npm run verify

      - name: Show what was built
        run: |
          echo "chrome:  $(find dist/chrome -type f | wc -l) files"
          echo "firefox: $(find dist/firefox -type f | wc -l) files"
          node -e "const c=require('./dist/chrome/manifest.json'),f=require('./dist/firefox/manifest.json');
            console.log('chrome background: ', JSON.stringify(c.background));
            console.log('firefox background:', JSON.stringify(f.background));
            if (!c.background.service_worker) { throw new Error('chrome build is not a service worker'); }
            if (!f.background.scripts) { throw new Error('firefox build is not an event page'); }"

      - name: Package store uploads
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: whilefree-chrome
          path: dist/whilefree-chrome-*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: whilefree-firefox
          path: dist/whilefree-firefox-*.zip
          if-no-files-found: error

      # The source archive Firefox asks for when it wants to review the code behind a build.
      - uses: actions/upload-artifact@v4
        with:
          name: whilefree-source
          path: |
            src/**
            scripts/**
            tests/**
            package.json
            README.md
            PRIVACY.md
            LICENSE

      - name: Attach zips to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/whilefree-chrome-*.zip
            dist/whilefree-firefox-*.zip
          generate_release_notes: true
